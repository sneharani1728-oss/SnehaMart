<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnehaMart - Women's Clothing</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f8f5f6;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            padding: 30px;
        }

        .product {
            background: white;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .product img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 10px;
        }

        .product h2 {
            font-size: 20px;
            margin: 12px 0 5px;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            margin: 8px;
        }

        button {
            background: #222;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }
    </style>
</head>

<body>

<header>
    <h1>🛍️ SnehaMart</h1>
    <p>Women's Fashion Collection</p>
</header>

<section class="products">

    <div class="product">
        <img src="https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?auto=format&fit=crop&w=500&q=80">
        <h2>Elegant Kurti</h2>
        <p class="price">₹799</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=500&q=80">
        <h2>Designer Saree</h2>
        <p class="price">₹1,499</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://images.unsplash.com/photo-1591369822096-ffd140ec948f?auto=format&fit=crop&w=500&q=80">
        <h2>Western Dress</h2>
        <p class="price">₹999</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://images.unsplash.com/photo-1564257577054-7e1b6b734c0d?auto=format&fit=crop&w=500&q=80">
        <h2>Crop Top</h2>
        <p class="price">₹499</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://images.unsplash.com/photo-1617627143750-d86bc21e42bb?auto=format&fit=crop&w=500&q=80">
        <h2>Salwar Suit</h2>
        <p class="price">₹1,199</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://images.unsplash.com/photo-1585488433566-0e9f3b2c9b9a?auto=format&fit=crop&w=500&q=80">
        <h2>Anarkali Dress</h2>
        <p class="price">₹1,399</p>
        <button>Buy Now</button>
    </div>

</section>

</body>
</html>
